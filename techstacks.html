                    <img id="modalImg" src="" class="max-w-full max-h-[90vh] w-auto h-auto rounded-lg shadow-2xl object-contain border border-white/10" />
                </div>
                
              </div>
            </dialog>

            <script>
              const modal = document.getElementById('certModal');
              const modalImg = document.getElementById('modalImg');

              function openModal(src) {
                modalImg.src = src;
                modal.showModal();
                // Use fixed to prevent background scroll corruption
                document.body.style.position = 'fixed';
                document.body.style.width = '100%';
              }

              function closeModal() {
                modal.close();
                document.body.style.position = '';
                document.body.style.width = '';
              }

              // Close when clicking the backdrop (the area outside the image)
              modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
              });
            </script>
